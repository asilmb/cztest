<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Чешский тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 760px reading column; setup and stats split into two columns on desktop.
   Header carries a modrotisk (Czech blueprint-print) dot band; answers sit in a thumb-reach action bar on phones. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e9edf5;
  --ink: #141a2e;
  --ink-2: #48516f;
  --muted: #737c9a;
  --line: #d9dfea;
  --accent: #2443c4;
  --accent-soft: #e2e8fb;
  --accent-ink: #ffffff;
  --ok: #1d8049;
  --ok-soft: #e1f3e8;
  --bad: #c42f37;
  --bad-soft: #fbe5e6;
  --warn: #d79a1e;
  --warn-soft: #fdf3dc;
  --learn: #7f93e0;
  --new: #cfd5e2;
  --blueprint: #1c3399;
  --blueprint-dot: rgba(255, 255, 255, .16);
  --shadow: 0 1px 2px rgba(20, 26, 46, .06), 0 6px 24px rgba(20, 26, 46, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
  --qs: 1;   /* question-screen text scale, set from the A− / A+ buttons */
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1120; --surface: #161b2e; --surface-2: #1e2540; --ink: #e9ecf6; --ink-2: #b0b8d2; --muted: #7f88a6;
    --line: #2a3254; --accent: #8199ff; --accent-soft: #232d57; --accent-ink: #0d1120;
    --ok: #4cc583; --ok-soft: #133022; --bad: #ff6f76; --bad-soft: #3b171b; --warn: #c99a3a; --warn-soft: #34290f; --learn: #5c6fc0; --new: #333b5c;
    --blueprint: #121c4f; --blueprint-dot: rgba(160, 180, 255, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1120; --surface: #161b2e; --surface-2: #1e2540; --ink: #e9ecf6; --ink-2: #b0b8d2; --muted: #7f88a6;
  --line: #2a3254; --accent: #8199ff; --accent-soft: #232d57; --accent-ink: #0d1120;
  --ok: #4cc583; --ok-soft: #133022; --bad: #ff6f76; --bad-soft: #3b171b; --warn: #c99a3a; --warn-soft: #34290f; --learn: #5c6fc0; --new: #333b5c;
  --blueprint: #121c4f; --blueprint-dot: rgba(160, 180, 255, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--blueprint); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* translation layer — toggled on the fly via a class on #app */
.t { display: block; }
.t .ru { display: none; color: var(--muted); font-size: .88em; font-style: italic; line-height: 1.35; margin-top: 2px; }
.show-ru .t .ru { display: block; }
.t.inline, .t.inline .cs { display: inline; }
.show-ru .t.inline .ru { display: inline; margin-left: .4em; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--blueprint); color: #fff;
  background-image: radial-gradient(var(--blueprint-dot) 1.4px, transparent 1.6px), radial-gradient(var(--blueprint-dot) 1.4px, transparent 1.6px);
  background-size: 18px 18px; background-position: 0 0, 9px 9px; }
.top-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; padding-block: 6px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; flex: none; background:
  conic-gradient(from 45deg, #fff 0 25%, transparent 0 50%, #fff 0 75%, transparent 0) ; box-shadow: inset 0 0 0 2px #fff; opacity: .92; }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.brand-text strong { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.brand-sub { font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; align-items: center; gap: 8px; flex: none; }
.store-pill + .controls { margin-left: 0; }
.store-line { display: none; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.store-line::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ok); vertical-align: 1px; }
.store-line[data-mode="local"]::before, .store-line[data-mode="readonly"]::before { background: var(--warn); }
.store-line[data-mode="connecting"]::before { background: var(--muted); }
@media (max-width: 720px) {
  .brand-text, .store-pill { display: none; }
  .store-pill + .controls { margin-left: auto; }
  .store-line { display: block; }
}
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(255,255,255,.16); }
.icon-btn svg { width: 20px; height: 20px; }

/* CZ/RU switch, styled like a day/night toggle */
.lang-switch { border: 0; padding: 0; background: none; }
.ls-track { position: relative; display: block; width: 72px; height: 36px; border-radius: 18px; background: linear-gradient(180deg, #ffd978, #ffb84d);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.25); transition: background .35s ease; overflow: hidden; }
.ls-track::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0f1638, #27357a); opacity: 0; transition: opacity .35s ease; }
.ls-track::after { content: ""; position: absolute; width: 2px; height: 2px; border-radius: 50%; top: 9px; left: 14px; background: #fff;
  box-shadow: 9px 12px 0 #fff, 17px 3px 0 0.5px #fff, 4px 17px 0 #fff; opacity: 0; transition: opacity .35s ease; }
.ls-cz, .ls-ru { position: absolute; top: 50%; transform: translateY(-50%); font: 600 11px/1 var(--f-mono); letter-spacing: .06em; z-index: 1; transition: opacity .3s; }
.ls-cz { right: 10px; color: #6b4300; }
.ls-ru { left: 10px; color: #dfe6ff; opacity: 0; }
.ls-knob { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff8e1; z-index: 2;
  box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.5,1.6,.4,1), background .35s, box-shadow .35s; }
.lang-switch[aria-checked="true"] .ls-track::before, .lang-switch[aria-checked="true"] .ls-track::after { opacity: 1; }
.lang-switch[aria-checked="true"] .ls-knob { transform: translateX(36px); background: #e6e9f5; box-shadow: inset -7px -3px 0 0 #b9c0dc, 0 2px 4px rgba(0,0,0,.35); }
.lang-switch[aria-checked="true"] .ls-cz { opacity: 0; }
.lang-switch[aria-checked="true"] .ls-ru { opacity: 1; }

.tabs { display: flex; align-items: center; gap: 2px; }
.tab { border: 0; background: none; color: rgba(255,255,255,.72); padding: 8px 10px; min-height: 40px; font-weight: 700; font-size: 15px; border-radius: 99px; }
.tab[aria-current="page"] { color: var(--blueprint); background: #fff; }
.controls { margin-left: auto; }
.store-pill { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.9); white-space: nowrap; }
.store-pill[data-mode="local"] { background: rgba(255, 196, 92, .22); }

/* main */
main { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
.build { max-width: 1040px; margin: 20px auto 0; text-align: center; font: 500 12px/1.4 var(--f-mono); color: var(--muted); }
.quiz + .build { margin-top: 14px; }
.actionbar + .build { margin-bottom: 84px; }   /* clears the fixed bar on the results screen */
.section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 860px) { .grid-2 { grid-template-columns: 1.1fr 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); font-size: 15px; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .count { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.chip .t .ru { font-size: 12px; }

/* mode cards */
.modes { display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 12px; align-items: start; text-align: left; padding: 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); }
.mode[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 3px; }
.mode[aria-checked="true"] .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
.mode b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.mode .desc { grid-column: 2 / 4; font-size: 14px; color: var(--ink-2); }
.mode .avail { font: 500 12px/1.6 var(--f-mono); color: var(--muted); white-space: nowrap; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 99px; background: var(--surface-2); }
.seg button { border: 0; min-height: 40px; border-radius: 99px; background: transparent; font-weight: 700; color: var(--ink-2); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.count-row { display: flex; align-items: center; gap: 14px; }
.count-row input[type=range] { flex: 1; accent-color: var(--accent); height: 32px; min-width: 0; }
.count-val { font: 600 26px/1 var(--f-mono); min-width: 2.5ch; text-align: right; }

.notice { display: flex; gap: 12px; align-items: flex-start; margin: 0 auto 16px; max-width: 1040px; padding: 12px 14px; border-radius: var(--r);
  background: var(--warn-soft); border: 1px solid var(--warn); font-size: 14px; line-height: 1.45; color: var(--ink); }
.notice strong { display: block; margin-bottom: 2px; }
.notice-x { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; }
.notice-x svg { width: 14px; height: 14px; }
.label-row { display: flex; align-items: center; gap: 8px; }
.hint-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--muted); background: var(--surface); color: var(--ink-2);
  font: 700 13px/1 var(--f-body); display: inline-grid; place-items: center; padding: 0; letter-spacing: 0; text-transform: none; position: relative; }
.hint-btn::after { content: ""; position: absolute; inset: -10px; }
.hint-btn:hover, .hint-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.hint-panel { margin: -2px 0 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--accent-soft); font-size: 14px; line-height: 1.45; }
.hint-panel p { margin: 0; }
.hint-panel p + p { margin-top: 6px; }
.tooltip b { font-weight: 700; }
.resume { border-color: var(--accent); background: var(--accent-soft); box-shadow: none; }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm input { min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }

/* sticky action bar (thumb reach on phones) */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.actionbar-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.actionbar-in .btn { flex: 1; }

/* quiz */
.quiz { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.qhead { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.qhead .pos { font: 600 14px/1 var(--f-mono); color: var(--ink); }
.score { display: inline-flex; align-items: center; gap: 4px; font: 600 13px/1 var(--f-mono); padding: 4px 8px; border-radius: 99px; }
.score.ok { color: var(--ok); background: var(--ok-soft); }
.score.bad { color: var(--bad); background: var(--bad-soft); }
.score svg { width: 12px; height: 12px; }
.pbar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; gap: 2px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.pbar i.fix { background: var(--bad); }
.phase { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--bad-soft); color: var(--ink); font-size: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); letter-spacing: .02em; }
.badge.kind { background: var(--accent-soft); color: var(--accent); }
.scenario { border-left: 3px solid var(--accent); background: var(--surface-2); padding: 8px 12px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: calc(15px * var(--qs)); line-height: 1.4; }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: calc(clamp(18px, 4.9vw, 25px) * var(--qs)); line-height: 1.25; }
.qtext .ru { font-family: var(--f-body); font-weight: 400; font-size: .7em; }
.scenario .t .cs, .scenario .t .ru { white-space: pre-line; }
.sc-head { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.scenario.clamped .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.chip-group { margin: 12px 0 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.no-ru { display: none; margin: -4px 0 0; font-size: 13px; font-style: italic; color: var(--muted); }
.show-ru .no-ru { display: block; }
.qtext.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; }
.more-btn { align-self: flex-start; margin-top: -6px; border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.font-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--surface); }
.font-ctl button { border: 0; background: none; min-width: 40px; min-height: 32px; font: 700 14px/1 var(--f-body); color: var(--ink); }
.font-ctl button + button { border-left: 1px solid var(--line); font-size: 17px; }
.font-ctl button:disabled { opacity: .35; cursor: default; }
.font-ctl sup { font-size: .65em; }
@media (max-width: 440px) { .qmode { display: none; } }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; padding: 9px 12px; min-height: 46px;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: calc(15px * var(--qs)); line-height: 1.35; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .mk { margin-top: 1px; width: 24px; height: 24px; display: grid; place-items: center; border: 2px solid var(--muted); font: 600 12px/1 var(--f-mono); color: var(--muted); }
.opt .mk.round { border-radius: 50%; }
.opt .mk.square { border-radius: 6px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt:disabled { cursor: default; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .mk { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .mk { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.is-missed { border-color: var(--ok); border-style: dashed; border-width: 2px; padding: 8px 11px; }
.opt.is-missed .mk { border-color: var(--ok); color: var(--ok); }
.opt.is-dim { opacity: .55; }
.opt .mk svg { width: 14px; height: 14px; }
.opt-note { display: block; margin-top: 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.is-ok .opt-note, .is-missed .opt-note { color: var(--ok); }
.is-bad .opt-note { color: var(--bad); }
.answer-bar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 3; display: flex; align-items: center; gap: 12px; min-height: 60px;
  padding: 8px 8px 8px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); animation: pop .2s ease-out; }
.answer-bar.ok { background: var(--ok-soft); border-color: var(--ok); }
.answer-bar.bad { background: var(--bad-soft); border-color: var(--bad); }
.answer-bar .btn { flex: none; min-width: 120px; min-height: 44px; margin-left: auto; }
.pick-hint { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.verdict { display: flex; align-items: center; gap: 10px; min-width: 0; }
.verdict .vi { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.answer-bar.ok .vi { background: var(--ok); }
.answer-bar.bad .vi { background: var(--bad); }
.verdict .vi svg { width: 16px; height: 16px; }

rrect":[3]},{"id":"1252","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"multi","question":"V které situaci jde o spotřebitelský úvěr v cizí měně?","options":["Občan České republiky pracující v zahraniční firmě a pobírající plat v dolarech si bere od české banky půjčku v korunách na byt v Praze.","Občan České republiky pracující v zahraniční firmě a pobírající plat v korunách si bere od české banky půjčku v korunách na byt v Praze.","Občan České republiky pracující v zahraniční firmě a pobírající plat v korunách si bere od české banky půjčku v eurech na apartmán v Alpách.","Občan Nizozemska žijící trvale v Amsterodamu a pobírající důchod v eurech si bere od české banky půjčku v eurech na chalupu ve Špindlerově Mlýně."],"correct":[0,2]},{"id":"1253","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Jaký důsledek pro mne bude mít, vezmu-li si nyní jako Čech žijící v Praze a pobírající plat v korunách eurový úvěr na koupi apartmánu v Alpách při sazbě 1,2 % p.a. na celou dobu trvání úvěru a Česká národní banka ukončí měnové intervence za podporu slabé koruny?","options":["žádný, podle zákona se v období fixace úrokové sazby nesmí měnit výše splátek","kurz koruny se pravděpodobně zvýší, zaplatím tedy každý měsíc v korunách méně","kurz koruny se pravděpodobně propadne, zaplatím tedy každý měsíc v korunách více","v důsledku zvýšení kurzu koruny vůči euru na tom banka prodělá a bude oprávněna vypovědět moji smlouvu"],"correct":[1]},{"id":"1254","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Co mi zákon o spotřebitelském úvěru umožňuje, vezmu-li si nyní jako Čech žijící v Praze a pobírající plat v korunách eurový úvěr na dovoz automobilu ze zahraničí a kurz koruny vůči euru začne klesat?","options":["změnit měnu úvěru na koruny české při kurzu platném ke dni uzavření smlouvy","změnit měnu úvěru na koruny české při kurzu platném ke dni podání žádosti o změnu měny úvěru","nic","předčasně splatit spotřebitelský úvěr a případně jej refinancovat v korunách u jiné banky"],"correct":[3]},{"id":"1255","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Co se stane, vezmu-li si nyní jako Čech žijící v Praze a pobírající plat v korunách eurový úvěr na koupi apartmánu v Alpách a kurz koruny vůči euru poklesne?","options":["na splátky úvěru v eurech budu muset vynaložit větší část svého příjmu než dosud","na splátky úvěru v eurech budu muset vynaložit menší část svého příjmu než dosud","nic, smlouva se ze zákona konvertuje z eur do korun za kurz platný ke dni uzavření smlouvy","aktivuje se mé právo změnit úvěr na jinou měnu při zachování původní eurové úrokové sazby"],"correct":[0]},{"id":"1256","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Mám-li (jako Čech bydlící v Praze) cizoměnový úvěr v eurech a hodlám-li využít svého práva změnit měnu úvěru, jaký kurz se použije pro změnu denominace úvěru z eur na koruny, není-li toto řešeno ve smlouvě o úvěru?","options":["kurz vyhlášený úvěrující bankou pro den, kdy byla uzavřena smlouva o úvěru","kurz vyhlášený Evropskou centrální bankou pro den, kdy došlo k aktivaci mého práva na změnu měny úvěru","kurz vyhlášený úvěrující bankou pro den, kdy odsouhlasila mou žádost o změnu měny úvěru","kurz vyhlášený Českou národní bankou pro den, kdy jsem požádal o změnu měny"],"correct":[3]},{"id":"1752","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Jakou maximální výši náhrady účelně vynaložených nákladů může věřitel požadovat po spotřebiteli za předčasné splacení spotřebitelského úvěru jiného než na bydlení, pokud zbývá více než jeden rok do konce splatnosti (nejedná-li se o případy, kdy věřitel nesmí požadovat žádnou náhradu nákladů)?","options":["Věřitel může po spotřebiteli požadovat náhradu účelně vynaložených nákladů maximálně do výše 1 % z předčasně splacené částky, výše náhrady nesmí přesáhnout výši zbývajících úroků.","Věřitel může požadovat pouze náhradu administrativních nákladů do výše 5000 Kč, výše náhrady nesmí přesáhnout výši zbývajících úroků.","Věřitel může po spotřebiteli požadovat náhradu účelně vynaložených nákladů maximálně do výše 0,5 % z předčasně splacené částky, výše náhrady nesmí přesáhnout výši zbývajících úroků.","Věřitel může po spotřebiteli požadovat náhradu účelně vynaložených nákladů maximálně do výše 0,5 % z předčasně splacené částky za každý rok zbývající do konce splatnosti úvěru, nejvýše však 2 % z předčasně splacené částky"],"correct":[0]},{"id":"1753","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Které z následujících tvrzení správně popisuje stanovení maximální výše náhrady účelně vynaložených nákladů za předčasné splacení spotřebitelského úvěru jiného než na bydlení?","options":["Výši náhrady těchto nákladů stanoví přímo Česká národní banka na základě měsíčních průměrů zápůjčních úrokových sazeb spotřebitelských úvěrů jiných než na bydlení.","Výše náhrady těchto nákladů nesmí přesáhnout 2 % z předčasně splacené částky, pokud zbývá méně než 12 měsíců do konce splatnosti, a zároveň nesmí přesáhnout výši zbývajících úroků.","Věřitel může výši náhrady těchto nákladů účtovanou spotřebiteli stanovit podle svých vnitřních pravidel, zákon maximální výši náhrady těchto nákladů nelimituje.","Výše náhrady těchto nákladů nesmí přesáhnout 1 % z předčasně splacené částky, pokud zbývá více než 1 rok do konce splatnosti, a zároveň nesmí přesáhnout výši zbývajících úroků."],"correct":[3]},{"id":"1754","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Co je úrokový rozdíl definovaný pro účely stanovení náhrady nákladů za předčasné splacení u spotřebitelského úvěru na bydlení podle § 2 odst. 2 písm. b) nebo c) zákona o spotřebitelském úvěru (tzv. rezidenčního úvěru)?","options":["Rozdíl mezi smluvním úrokem a průměrnou zápůjční úrokovou sazbou zveřejňovanou na internetových stránkách Českou národní bankou.","Rozdíl mezi smluvním úrokem a referenčním úrokem.","Rozdíl mezi smluvním úrokem a mezibankovní referenční sazbou PRIBOR.","Rozdíl mezi referenčním úrokem stanoveným Českou národní bankou a skutečnými náklady věřitele na předčasné splacení rezidenčního úvěru."],"correct":[1]},{"id":"1755","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Pro účely stanovení náhrady nákladů věřiteli za předčasné splacení u spotřebitelského úvěru na bydlení podle § 2 odst. 2 písm. b) nebo c) zákona o spotřebitelském úvěru (tzv. rezidenčního úvěru) se referenční úrok vypočítává pomocí:","options":["Průměru zápůjčních úrokových sazeb uveřejněného Českou národní bankou v kalendářním měsíci předcházejícím dni předčasného splacení.","Průměru měsíčních úroků pro skupinu srovnatelných spotřebitelských úvěrů na bydlení uveřejňovaných Českou národní bankou.","Mezibankovní referenční sazby PRIBOR.","Průměru roční procentní sazby nákladů pro skupinu srovnatelných spotřebitelských úvěrů na bydlení uveřejněného Českou národní bankou."],"correct":[0]},{"id":"1756","category":"Кредитный договор: отказ, досрочное погашение, просрочка и иностранная валюта","section":"Znalosti","type":"single","question":"Pro účely stanovení náhrady nákladů věřiteli za předčasné splacení u spotřebitelského úvěru na bydlení podle § 2 odst. 2 písm. b) nebo c) zákona o spotřebitelském úvěru (tzv. rezidenčního úvěru) se účelně vynaloženými náklady rozumí:","options":["Částka odpoví astníky na katastr nemovitostí."],"correct":[1]},{"id":"1737","category":"Недвижимость, кадастр и обеспечение кредита","section":"Znalosti","type":"multi","question":"Které z následujících ujednání je možno sjednat platně a účinně v souladu s novým občanským zákoníkem (zákon č. 89/2012 Sb.)?","options":["Dlužník nebo zástavce nesmí zástavu vyplatit.","Zástavní dlužník je povinen nechat zastavenou věc pojistit a oznámit zástavnímu věřiteli jakékoli vážné znehodnocení zastavené věci.","Zástavní dlužník není oprávněn zástavu zatížit bez souhlasu zástavního věřitele.","Spotřebitel jako zástavní dlužník a zástavní věřitel si v zástavní smlouvě dohodnou předem určenou cenu, za kterou si může zástavní věřitel ponechat zástavu v případě, že dlužník nebude moci splatit dluh."],"correct":[1,2]},{"id":"12","category":"Страхование","section":"Znalosti","type":"single","question":"Úplata za soukromé pojištění se nazývá:","options":["malus","bonus","zajistné","pojistné"],"correct":[3]},{"id":"40","category":"Страхование","section":"Znalosti","type":"single","question":"Karenční doba je:","options":["doba, po kterou si pojišťovna vyhrazuje právo neplatit pojistné plnění","doba, po kterou se neplatí pojistné","doba, kdy pojištěnému vzniká právo na pojistné plnění","období platnosti pojistné smlouvy"],"correct":[0]},{"id":"89","category":"Страхование","section":"Znalosti","type":"single","question":"Osoba určená pojistníkem v pojistné smlouvě, které vznikne právo na pojistné plnění v případě smrti pojištěného, se nazývá","options":["poškozený","pojistitel","obmyšlený","pojistník"],"correct":[2]},{"id":"90","category":"Страхование","section":"Znalosti","type":"single","question":"Co je pojistná hodnota?","options":["výše pojistného za pojistná nebezpečí","limit pojistného plnění","nejvyšší možná majetková újma, která může nastat v důsledku pojistné události","limit spoluúčasti"],"correct":[2]},{"id":"154","category":"Страхование","section":"Znalosti","type":"single","question":"Pojis sti věřitelem","soud přihlédne k neplatnosti i bez vznesení námitky neplatnosti"],"correct":[3]},{"id":"1176","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"multi","question":"Jak lze nahradit podpis plně svéprávné osoby, která se nemůže podepsat?","options":["podpisem blízkého příbuzného","dvěma svědky","učiněním znamení na listině před dvěma svědky","veřejnou listinou"],"correct":[2,3]},{"id":"1178","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Promlčecí lhůta u pohledávky ze spotřebitelského úvěru trvá:","options":["1 rok","3 roky","5 let","10 let"],"correct":[1]},{"id":"1180","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Splátky spotřebitelského úvěru se promlčují:","options":["ve lhůtě 3 let od konce platnosti spotřebitelského úvěru","ve lhůtě 10 let od uzavření smlouvy o spotřebitelském úvěru","ve lhůtě 3 let od konce kalendářního roku, v němž měly být zaplaceny","ve lhůtě 3 let od doby jejich splatnosti"],"correct":[3]},{"id":"1181","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Uznal-li dlužník svůj dluh, promlčí se právo věřitele na vrácení pohledávky:","options":["za 3 roky ode dne splatnosti pohledávky","za 10 let ode dne splatnosti pohledávky","za 10 let ode dne, kdy k uznání dluhu došlo","za 3 roky ode dne, kdy k uznání dluhu došlo"],"correct":[2]},{"id":"1182","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Odchylují-li se obchodní podmínky, na které odkazuje uzavřená smlouva, od ustanovení této uzavřené smlouvy, platí že:","options":["je smlouva neplatná","spotřebitel může od smlouvy odstoupit","mají přednost obchodní podmínky","má přednost ustanovení smlouvy"],"correct":[3]},{"id":"1188","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Vyberte správné tvrzení. Dlužník přestal splácet spotřebitelský úvěr, věřitel pohledávku postoupil inkasní agentuře bez dlužníkova souhlasu.","options":["Postoupení pohledávky není platné, pohledávku ze spotřebitelského úvěru nelze postoupit.","Postoupení pohledávky není platné, pohledávku ze spotřebitelského úvěru lze postoupit pouze s dlužníkovým souhlasem.","Dlužník, kterému bylo postoupení pohledávky původním věřitelem oznámeno, může i nadále plnit původnímu věřiteli, dokud inkasní agentura dlužníkovi postoupení pohledávky neprokáže.","Dlužník může plnit původnímu věřiteli, dokud mu ten neoznámí postoupení pohledávky, nebo dokud mu inkasní agentura postoupení pohledávky neprokáže."],"correct":[3]},{"id":"1206","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Manželé vlastní ve společném jmění manželů malý starý dům v rušném centru města. Muž se rozhodl, že překvapí svou ženu, a uzavřel smlouvu o prodeji tohoto domu a koupi domu nového v moderní vilové čtvrti na okraji města. Když to ženě oznámil v den stěhování, žena byla zděšena a stěhování odmítla, neboť si po pěti letech v místě již zvykla.","options":["Žena se může dovolat neplatnosti uzavřených smluv, neboť by stěhováním byla narušena rodinná domácnost.","Žena se může dovolat neplatnosti uzavřených smluv, neboť k prodeji a koupi nemovitostí ve společném jmění manželů je třeba souhlasu obou manželů.","Žena se může dovolat neplatnosti uzavřených smluv pouze ve lhůtě 14 dnů ode dne, kdy jí o tom manžel řekl.","Žena se nemůže dovolat neplatnosti uzavřených smluv, neboť jde o běžné nakládání s majetkem ve společném jmění manželů, k němuž stačí souhlas pouze jednoho z manželů."],"correct":[1]},{"id":"1207","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Muž, který žije se svou manželkou v třípokojovém bytě, který zdědil po svých prarodičích, se rozhodl, že byt prodá a odstěhuje se na chalupu 200 km daleko. Pak podá žádost o rozvod. Pokud jejich vzájemný vztah nebyl smluvně ošetřen jinak, jeho žena:","options":["nemůže nic dělat, protože byt není v SJM","nemůže nic dělat, protože děti jsou již odrostlé a v rodinné domácnosti nežijí","se může dovolat neplatnosti smlouvy o prodeji","může po manželovi požadovat, aby jí zajistil náhradní bydlení"],"correct":[2]},{"id":"1208","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Kdy je dlužník v úpadku?","options":["když má jednoho věřitele a není schopen splácet","když má tři věřitele a zapomněl zaplatit jednu splátku","když má tři věřitele, kterým po dohodě platí nižší splátky","když má více než jednoho věřitele, je v prodlení déle než 30 dnů a není schopen dluhy splácet"],"correct":[3]},{"id":"1209","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Spotřebitel má tři úvěrové smlouvy: na 1 500 000 Kč hypoteční úvěr od banky A1, na 100 000 Kč spotřebitelský úvěr od úvěrové společnosti B a na 50 000 Kč rychlou půjčku od banky A2. U všech věřitelů je v prodlení s platbami více než jeden měsíc. Kdo může podat insolvenční návrh?","options":["pouze dlužník","dlužník nebo kterýkoliv z věřitelů","pouze věřitel s největší pohledávkou za 1 500 000 Kč","věřitelé s pohledávkami za 100 000 Kč a 50 000 Kč"],"correct":[1]},{"id":"1213","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Po zahájení insolvenčního řízení dlužník splatil jednomu ze tří věřitelů na úkor ostatních svůj závazek. Čeho se dlužník dopustil?","options":["ničeho","přestupku","trestného činu","správního deliktu"],"correct":[2]},{"id":"1214","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Na majetek spotřebitele je zahájena exekuce. Spotřebitel však podal návrh na oddlužení a soud zahájil insolvenční řízení. Jak je dále postupováno s exekucí?","options":["Je zrušena.","Pokud insolvenční soud nerozhodne jinak, nemůže být provedena.","Je dokončena.","Probíhá současně s insolvenčním řízením."],"correct":[1]},{"id":"1215","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Kdy se dlužník dopustí trestného činu?","options":["Když na sebe podá insolvenční návrh.","Při oddlužení plní schválený splátkový kalendář.","V průběhu insolvenčního řízení zvýhodní jednoho věřitele tím, že mu zaplatí.","V rámci insolvenčního řízení nezvýhodní věřitele, který ho o to výslovně požádá."],"correct":[2]},{"id":"1216","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Pan Novák splní podmínky oddlužení a splatí všem věřitelům 30 % všech pohledávek. Co se stane se zbytkem dluhů?","options":["Zbytek dluhu bude uhrazen z Fondu pojištění vkladů.","Za pana Nováka zbytek dluhu uhradí Česká správa sociálního zabezpečení.","Pan Novák je osvobozen od povinnosti zbytek dluhů uhradit.","Pan Novák musí zbytek dluhu uhradit v následujících 5 letech."],"correct":[2]},{"id":"1217","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Osvobození od nesplacené části dluhů po splnění oddlužení nastává:","options":["automaticky","na základě návrhu insolvenčního správce","na základě návrhu věřitelského výboru","na základě návrhu dlužníka"],"correct":[3]},{"id":"1218","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Co se stane s nesplacenými dluhy, které zbyly po zpeněžení dlužníkova majetku v konkursu?","options":["Zaniknou.","Uhradí je stát.","Nezaniknou, ale dlužník není povinen je splácet.","Nezaniknou, dlužník je nadále povinen je splácet."],"correct":[3]},{"id":"1219","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Spotřebitel uzavřel u notáře smlouvu s věřitelem, která obsahuje doložku přímé vykonatelnosti. Co to pro spotřebitele znamená?","options":["Sepsáním této smlouvy dochází k zahájení insolvenčního řízení.","Notář se zavazuje dohlížet na to, že spotřebitel bude řádně a včas splácet.","Spotřebitel nesmí splácet dluh, dokud k tomu není výslovně vyzván.","V případě prodlení spotřebitele se splácením lze přistoupit rovnou k exekuci."],"correct":[3]},{"id":"1220","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Doložku přímé vykonatelnosti lze uzavřít u:","options":["příslušného policejního oddělení","arbitra","exekutora","notáře"],"correct":[3]},{"id":"1221","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Doložka přímé vykonatelnosti, neboli exekuční doložka, může mít dle současné právní úpravy formu:","options":["zápisu do katastru nemovitostí","veřejné listiny","exekutorského zápisu","notářského zápisu"],"correct":[3]},{"id":"1222","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Pan Novák uzavřel u exekutora smlouvu s věřitelem, která obsahuje doložku přímé vykonatelnosti. Co to pro pana Nováka znamená?","options":["Sepsáním této smlouvy dochází k zahájení exekuce.","Exekutor se zavazuje dohlížet na to, že bude pan Novák řádně a včas splácet.","Nic. Exekuční doložku lze uzavřít pouze před notářem.","V případě prodlení pana Nováka se splácením lze přistoupit rovnou k exekuci."],"correct":[2]},{"id":"1223","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Jaké výhody má pro klienta, pokud odmítne podepsat doložku přímé vykonatelnosti v souvislosti se smlouvou o úvěru, pokud s věřitelem jinak souhlasí a samotnou smlouvu podepíší?","options":["Klient není povinen splácet jistinu úvěru.","Věřitel nemá právo využít k exekuci soudního exekutora.","Věřitel se vzdal práva zpochybňovat nároky dlužníka před soudem v rámci případného nalézacího řízení.","V případě vzniku sporu není dotčeno jeho právo bránit se před soudem v rámci případného nalézacího řízení."],"correct":[3]},{"id":"1224","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Odmítne-li dlužník převzít soudní písemnost určenou do vlastních rukou, po určité době nastane tzv. fikce doručení, kdy se písemnost považuje za doručenou. Jak dlouhá je tato doba?","options":["7 dní","10 dní","15 dní","30 dní"],"correct":[1]},{"id":"1225","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Co je tzv. fikce doručení v případě soudních písemností?","options":["Písemnost se považuje za doručenou okamžikem odeslání soudem.","Písemnosti soudu se nedoručují, ledaže o to adresát výslovně požádá.","Písemnost se považuje za doručenou už v okamžiku, kdy adresát nebyl zastižen v místě bydliště.","Písemnost se považuje za doručenou uplynutím deseti dnů od uložení na poště, poté co adresát nebyl zastižen."],"correct":[3]},{"id":"1226","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"multi","question":"Co patří mezi základní způsoby provedení exekuce?","options":["srážky ze mzdy","odkázání dluhu","přikázání pohledávky","prodej movitých věcí"],"correct":[0,2,3]},{"id":"1227","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Při provádění exekuce formou srážek ze mzdy nesmí být dlužníkovi sražena tzv. nezabavitelná částka. Jak se tato částka určuje?","options":["Stanoví ji zaměstnavatel (plátce mzdy) dle svého uvážení.","Způsob jejího výpočtu je přesně stanoven právními předpisy.","Dlužník si ji stanoví sám podle výše svých příjmů.","Stanoví ji věřitel podle osobních poměrů dlužníka."],"correct":[1]},{"id":"1228","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Vůči dlužníkovi je nařízena exekuce přikázáním pohledávky z účtu u peněžního ústavu. Jakým způsobem může dlužník svým účtem disponovat?","options":["Může se svým účtem i nadále nakládat bez omezení.","Může se svým účtem nakládat jen se souhlasem banky.","Může každý měsíc vybírat z účtu částku odpovídající životnímu minimu jednotlivce.","Může maximálně vybrat z účtu částku odpovídající dvojnásobku životního minima jednotlivce."],"correct":[3]},{"id":"1229","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"multi","question":"Které věci jsou vyloučeny z exekuce?","options":["rodinný dům","snubní prsten","osobní automobil","invalidní vozík"],"correct":[1,3]},{"id":"1230","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"multi","question":"Jaký majetek dlužníka může být postižen exekucí formou prodeje věci?","options":["starožitné hodiny","věci, které potřebuje k plnění pracovních úkolů","nezbytné zdravotnické potřeby","sportovní náčiní"],"correct":[0,3]},{"id":"1231","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"Na majetek pana Nováka byla nařízena exekuce formou prodeje věci. Kterých věcí se exekuce může týkat?","options":["zlaté zubní protézy","běžného oblečení","půjčené travní sekačky","lyží"],"correct":[3]},{"id":"1232","category":"Гражданское право, исковая давность, взыскание и банкротство","section":"Znalosti","type":"single","question":"U pana Nováka probíhala exekuce. Exekutor zabavil také počítač, který pan Novák nezbytně potřebuje ke své práci. Jak se může pan Novák bránit?","options":["Bez zbytečného odkladu podá písemnou stížnost na postup exekutora k exekutorské komoře.","Do 14 dnů podá u soudu návrh na vyškrtnutí neoprávněně zapsaných věcí v soupisu movitých věcí.","Podá k věřiteli do 7 dnů žádost o vrácení neoprávněně zabavených věcí podle soupisu movitých věcí.","Do 30 dnů podá exekutorovi návrh na vyškrtnutí neoprávněně zapsaných věcí ze soupisu movitých věcí."],"correct":[3]},{"id":"10","category":"Защита потребителей и финансовый арбитр","section":"Znalosti","type":"single","question":"Finanční arbitr nemůže rozhodovat v následujících sporech ze spotřebitelského úvěru:","options":["spor o výši sankcí za prodlení dlužníka","spor o zamítnutí žádosti o spotřebitelský úvěr","spor o správnost výše náhrady nákladů za předčasné splacení úvěru","spor o platnost smlouvy o úvěru"],"correct":[1]},{"id":"25","category":"Защита потребителей и финансовый арбитр","section":"Znalosti","type":"multi","question":"Co všechno musí obsahovat návrh na zahájení řízení před finančním arbitrem?","options":["Označení účastníků řízení.","Datum a podpis navrhovatele.","Označení, čeho se navrhovatel domáhá.","Plnou moc, je-li navrhovatel zastoupen na základě plné moci."],"correct":[0,1,2,3]},{"id":"85","category":"Защита потребителей и финансовый арбитр","section":"Znalosti","type":"single","question":"Finanční arbitr nemůže rozhodnout spory o spotřebitelském úvěru, pokud:","options":["je ve smlouvě o spotřebitelském úvěru sjednána rozhodčí doložka","ve věci již bylo rozhodnuto u finančního ombudsmana finanční instituce","obě strany sporu nesouhlasí s předáním rozhodnutí finančnímu arbitrovi","spor již rozhodl rozhodce nebo soud"],"correct":[3]},{"id":"86","category":"Защита потребителей и финансовый арбитр","section":"Znalosti","type":"single","question":"Proti rozhodnutí finančního arbitra v podobě nálezu ve sporu o spotřebitelském ú :"situation","case":"1616","scenario":"Manželé Ondřej a Iva si koupili byt 3+1 do vlastnictví. Koupi bytu financovali pomocí úvěru na bydlení ve výši 1 900 000 Kč, který má dobu splácení 25 let a fixace je nastavena na 5 let. Manželé si dále vzali půjčku na vybavení domácnosti ve výši 100 000 Kč. Smlouvu o úvěru na bydlení a půjčku podepsali 16. února 2017.","question":"Ondřej a Iva zvažují po třech letech prodej bytu. Jakou výši nákladů může banka požadovat při předčasném splacení úvěru na bydlení, pokud se k prodeji bytu skutečně rozhodnou? K datu 16. února 2020 činí zůstatek úvěru na bydlení 1 600 000 Kč","options":["16 000 Kč","0 Kč","50 000 Kč","8 000 Kč"],"correct":[0]},{"id":"1652","category":"Ипотека в ходе погашения: фиксация, досрочное погашение, рефинансирование, проблемы с выплатами","section":"Dovednosti","type":"situation","case":"1616","scenario":"Manželé Ondřej a Iva si koupili byt 3+1 do vlastnictví. Koupi bytu financovali pomocí úvěru na bydlení ve výši 1 900 000 Kč, který má dobu splácení 25 let a fixace je nastavena na 5 let. Manželé si dále vzali půjčku na vybavení domácnosti ve výši 100 000 Kč. Smlouvu o úvěru na bydlení a půjčku podepsali 16. února 2017.","question":"Na konci období první fixace (tj. od února 2022) manželé sjednají v rámci úvěru na bydlení variabilní úrokovou sazbu. Rok poté pak chtějí splatit 950 000 Kč. Jakou výši nákladů po nich pak banka může vyžadovat?","options":["0 Kč","4 750 Kč","50 000 Kč","9 500 Kč"],"correct":[0]},{"id":"1653","category":"Ипотека в ходе погашения: фиксация, досрочное погашение, рефинансирование, проблемы с выплатами","section":"Dovednosti","type":"situation","case":"1616","scenario":"Manželé Ondřej a Iva si koupili byt 3+1 do vlastnictví. Koupi bytu financovali pomocí úvěru na bydlení ve výši 1 900 000 Kč, který má dobu splácení 25 let a fixace je nastavena na 5 let. Manželé si dále vzali půjčku na vybavení domácnosti ve výši 100 000 Kč. Smlouvu o úvěru na bydlení a půjčku podepsali 16. února 2017." obová v době uzavírání smlouvy o spotřebitelském úvěru musela vědět, že brzy porodí a v důsledku péče o nezletilého syna Jana nebude moci pracovat ve svém dosavadním zaměstnání, což se negativně projeví na příjmech a úvěruschopnosti celé rodiny, v důsledku čehož je uzavřená smlouva o spotřebitelském úvěru automaticky od počátku neplatná"],"correct":[0]},{"id":"1714","category":"Наличные займы, кредитные карты, овердрафт и кредитоспособность","section":"Dovednosti","type":"situation","case":"1693","scenario":"Svobodný třicetiletý MUDr. Koutný bydlí v nájemním bytě v Pardubicích a pracuje v místní nemocnici. Jeho čistý měsíční příjem činí 31 000 Kč. Měsíčně platí nájem 2 800 Kč, 480 Kč za elektřinu, 500 Kč za internet a k tomu měsíčně platí 500 Kč na doplňkové penzijní spoření a 1 000 Kč na stavební spoření. U své banky má poskytnuté povolené přečerpání ve výši 20 000 Kč, které moc nevyužívá, kreditní kartu s limitem 50 000 Kč, kterou využívá pravidelně, a měsíčně proto splácí 1 500 Kč. Dále má od nebankovního poskytovatele úvěr na nákup mobilního telefonu s tím, že splácí 1 000 Kč měsíčně po dobu cca 3 měsíců (zbývá ještě 15 měsíců), a u banky si půjčil peníze na vybavení domácnosti ve výši 250 000 Kč, v tomto případě splácí 5 180 Kč (úroková sazba 8,9 % p.a.) po dobu 1 roku a další 4 roky splácení má ještě před sebou. Pan Koutný Vás oslovil jako svého poradce s tím, že si chce půjčit 150 000 Kč na koupi nějakého staršího vozu a nechce využít leasing.","question":"Jakou maximální měsíční splátku si může MUDr. Koutný dovolit splácet za předpokladu, že veškeré jeho další výdaje činí 6 820 Kč?","options":["11 220 Kč","17 430 Kč","16 370 Kč","14 630 Kč"],"correct":[0]},{"id":"1715","category":"Наличные займы, кредитные карты, овердрафт и кредитоспособность","section":"Dovednosti","type":"situation","case":"1693","scenario":"Svobodný třicetiletý MUDr. Koutný bydlí v nájemním bytě v Pardubicích a pracuje v místní nemocnici. Jeho čistý měsíční příjem činí 31 000 Kč. Měsíčně ředmět oceňování nemovitostí na Vysoké škole ekonomické v Praze a v asociovaném Institutu oceňování majetku. Není ovšem soudním znalcem v oboru nemovitostí ani nedisponuje příslušným živnostenským oprávněním. Je ocenění předložené touto osobou z hlediska zákona o spotřebitelském úvěru akceptovatelné?","options":["ano, ocenění může být provedeno libovolnou důvěryhodnou a odborně způsobilou osobou, která je dostatečně nezávislá na procesu poskytování spotřebitelského úvěru","ne, pan Novák ne disponuje příslušným živnostenským oprávněním","ne, ocenění lze provést výhradně soudním znalcem v oboru oceňování nemovitostí","ne, pan Novák by musel být zapsán v seznamu odhadců schváleném Českou národní bankou a zveřejněném poskytovatelem"],"correct":[0]},{"id":"1648","category":"Посредник, правила поведения и обязательные условия договора","section":"Dovednosti","type":"situation","case":"1615","scenario":"Pan Mrázek zamýšlí pořídit si byt za účelem jeho dlouhodobého pronájmu. Za účelem sjednání nejvhodnějšího spotřebitelského úvěru pro financování nákupu tohoto bytu oslovil zprostředkovatele spotřebitelského úvěru, aby mu v této věci poradil.","question":"Je nepožadování náhrady nákladů na ocenění předmětu zajištění, které poskytovatel panu Mrázkovi nabízí, povolenou pobídkou?","options":["ano","ne","ano, pokud náklady na ocenění nepřesáhly 5 000,- Kč.","ne, ledaže by nemohl zprostředkovat úvěr danému spotřebiteli za výhodnějších podmínek"],"correct":[0]},{"id":"1659","category":"Посредник, правила поведения и обязательные условия договора","section":"Dovednosti","type":"situation","case":"1618","scenario":"V registru České národní banky zapsaný poskytovatel spotřebitelského úvěru a zároveň samostatný zprostředkovatel, firma SolidCredit s.r.o., má 19 pracovníků a jejím jediným jednatelem je pan Pink. Firma SolidCredit s.r.o. zprostředkovává úvěry pro poskytovatele Dobrý úvěr s.r.o., Bezva úvěr a.s. a Skvělý úvěr s.r.o. Jednatel společnosti SolidCredit s.r.o. vydal pro letošní rok v lednu interní pokyn, jehož nosná ustanovení jsou tato:a) Cílovou odměnu 10 000 Kč za letošní rok získá ten pracovník, který panu Pinkovi doporučí alespoň 5 dalších fyzických osob, které se pak jakkoli smluvně zapojí do obchodní sítě SolidCreditu a jejich zapojení přinese nárůst zisku firmy alespoň o 50 000 Kč za příští účetní rok; získané osoby nejprve absolvují dvoudenní vstupní školení za poplatek 7 950 Kč, až pak se s nimi podepíše vhodná smlouva.b) Provize od Bezva úvěru a.s. je nic moc, úrokové sazby a RPSN mají sice taky nízké, ale jejich smluvní dokumentace je příliš obsáhlá a je s ní moc práce, tedy jejich propagační materiály netřeba vystavovat tak, aby byly pro klienty nejlépe vidět a oni se úvěru od Bezva úvěru dožadovali jako prvního v pořadí (materiály však nelze nevystavit a jejich produkty nějak upozaďovat - lidi od Bezva úvěru totiž chodí na kontroly).c) Provize od Skvělého úvěru s.r.o. je co do procenta z částek uzavřených úvěrových smluv největší. Mají vysoké úrokové sazby a víme, že spolupracují s dalšími šikovnými firmami, takže ve finále prakticky nemají problémy se splácením svých úvěrů - o splácení se starají sami. Přestože je známo, že na jejich praktiky při vymáhání dlužných splátek si spotřebitelé často stěžují, nejde o odpovědnost SolidCreditu, který má naopak prospěch z nízkého podílu dlouhodobě nesplácených úvěrů; z každého úvěru uzavřeného pro Skvělý úvěr tak bude osobní provize pro pracovníka o polovinu vyšší než u úvěrů od ostatních poskytovatelů. d) Byl vypracován velmi podrobný ceník interních úkonů (43 různých položek), který stanoví ceny, jež klient zaplatí, i když si úvěr nakonec nevezme. Je na každém pracovníkovi, jak bude s klientem zacházet, aby mu mohl něco naúčtovat - a jako SolidCredit bychom tedy nedělali zadarmo v případech, kdy si spotřebitel někdy i po dlouhých diskusích úvěr nakonec nevezme.e) Úvěry na bydlení od Dobrého úvěru s.r.o. je vhodné s klienty sjednávat hlavně od částky 750 000 Kč výše, protože až od této limitní částky by měl spotřebitel dostat i kupón od firmy MegaStav na slevu 11 % na stavební materiál nakupovaný z poskytnutého úvěru, a to do výše až poloviny částky tohoto úvěru. K dispozici je na letošní rok 130 kupónů. Pokud nějaké kupóny před koncem roku nebudou rozdány klientům, budou po prosinci rozdány zájemcům z řad pracovníků SolidCreditu, aby zbytečně nepropadly, aspoň nějak by se tím kompenzovala nízká provize od Dobrého úvěru pro SolidCredit (od ostatních je totiž provize vyšší).f) Dva pracovníci, kteří sjednají největší počet po 15 měsíců řádně splácených spotřebitelských úvěrů a zároveň podíl jimi sjednaných spotřebitelských úvěrů, které jsou v prodlení s alespoň jednou splátkou či s jinými problémy, nepřekročí 3 % jimi sjednaného počtu úvěrů, dostanou pro následující rok navíc týden zvláštního volna vykázaného jako dovolená.g) Každý pracovník, který sjedná úvěr na koupi automobilu od autosalónu Pink & bratři s.r.o., dostane zvláštní provizi ve výši 1,25 % z výše řádně zaplacené splátky úvěru za prvních 15 měsíců jeho splácení, a to přímo od prodejce automobilu.h) Vánoční odměny v předpokládané výši \"třináctého platu\" budou každému pracovníkovi kráceny o 50 Kč za každou klientovi zaslanou upomínku k jím sjednanému spotřebitelskému úvěru, o 100 Kč pak za prodlení klienta s každou splátkou jím sjednaného spotřebitelského úvěru za každý měsíc prodlení.","question":"Které z ustanovení z interního pokynu jednatele společnosti SolidCredit s.r.o. b), c), g) a h) zcela jistě porušuje závazná pravidla jednání stanovená v zákoně o spotřebitelském úvěru?","options":["ustanovení c), protože pobídka navádí k poskytování úvěrů od Skvělého úvěru, tedy poskytovatele, který praktikuje metody vymáhání úvěru, které přinejmenším obcházejí zákon - a tedy nechrání zájmy spotřebitele tím, že ho vystavují zvláštním rizikům","ustanovení b), protože obsáhlá a pracná dokumentace nedává žádnou záruku, že se v ní spotřebitel nakonec vyzná, jak by se v ní vyznat měl - a to, že se v ní spotřebitel vyzná, je nutnou podmínkou toho, aby ji vůbec mohl podepsat","ustanovení g), protože zvláštní provize za sjednání konkrétního úvěru je nedovolená vždy a není rozhodné, kdo je jejím plátcem, podstatné je, že ji dostává pracovník, který sjednává úvěr (i když obchodní smysl takto konstruované provize je velmi diskutabilní)","ustanovení h), protože i předem oznámená peněžní sankce v odměňování pracovníka SolidCreditu za později problémový úvěr, tedy \"negativní\" pobídka, je pobídkou a v tomto případě je navíc stanoven přímo tvrdý sazebník takových \"pobídek\""],"correct":[0]},{"id":"1660","category":"Посредник, правила поведения и обязательные условия договора","section":"Dovednosti","type":"situation","case":"1618","scenario":"V registru České národní banky zapsaný poskytovatel spotřebitelského úvěru a zároveň samostatný zprostředkovatel, firma SolidCredit s.r.o., má 19 pracovníků a jejím jediným jednatelem je pan Pink. Firma SolidCredit s.r.o. zprostředkovává úvěry pro poskytovatele Dobrý úvěr s.r.o., Bezva úvěr a.s. a Skvělý úvěr s.r.o. Jednatel společnosti SolidCredit s.r.o. vydal pro letošní rok v lednu interní pokyn, jehož nosná ustanovení jsou tato:a) Cílovou odměnu 10 000 Kč za letošní rok získá ten pracovník, který panu Pinkovi doporučí alespoň 5 dalších fyzických osob, které se pak jakkoli smluvně zapojí do obchodní sítě SolidCreditu a jejich zapojení přinese nárůst zisku firmy alespoň o 50 000 Kč za příští účetní rok; získané osoby nejprve absolvují dvoudenní vstupní školení za poplatek 7 950 Kč, až pak se s nimi podepíše vhodná smlouva.b) Provize od Bezva úvěru a.s. je nic moc, úrokové sazby a RPSN mají sice taky nízké, ale jejich smluvní dokumentace je příliš obsáhlá a je s ní moc práce, tedy jejich propagační materiály netřeba vystavovat tak, aby byly pro klienty nejlépe vidět a oni se úvěru od Bezva úvěru dožadovali jako prvního v pořadí (materiály však nelze nevystavit a jejich produkty nějak upozaďovat - lidi od Bezva úvěru totiž chodí na kontroly).c) Provize od Skvělého úvěru s.r.o. je co do procenta z částek uzavřených úvěrových smluv největší. Mají vysoké úrokové sazby a víme, že spolupracují s dalšími šikovnými firmami, takže ve finále prakticky nemají problémy se splácením svých úvěrů - o splácení se starají sami. Přestože je známo, že na jejich praktiky při vymáhání dlužných splátek si spotřebitelé často stěžují, nejde o odpovědnost SolidCreditu, který má naopak prospěch z nízkého podílu dlouhodobě nesplácených úvěrů; z každého úvěru uzavřeného pro Skvělý úvěr tak bude osobní provize pro pracovníka o polovinu vyšší než u úvěrů od ostatních poskytovatelů. d) Byl vypracován velmi podrobný ceník interních úkonů (43 různých položek), který stanoví ceny, jež klient zaplatí, i když si úvěr nakonec nevezme. Je na každém pracovníkovi, jak bude s klientem zacházet, aby mu mohl něco naúčtovat - a jako SolidCredit bychom tedy nedělali zadarmo v případech, kdy si spotřebitel někdy i po dlouhých diskusích úvěr nakonec nevezme.e) Úvěry na bydlení od Dobrého úvěru s.r.o. je vhodné s klienty sjednávat hlavně od částky 750 000 Kč výše, protože až od této limitní částky by měl spotřebitel dostat i kupón od firmy MegaStav na slevu 11 % na stavební materiál nakupovaný z poskytnutého úvěru, a to do výše až poloviny částky tohoto úvěru. K dispozici je na letošní rok 130 kupónů. Pokud nějaké kupóny před koncem roku nebudou rozdány klientům, budou po prosinci rozdány zájemcům z řad pracovníků SolidCreditu, aby zbytečně nepropadly, aspoň nějak by se tím kompenzovala nízká provize od Dobrého úvěru pro SolidCredit (od ostatních je totiž provize vyšší).f) Dva pracovníci, kteří sjednají největší počet po 15 měsíců řádně splácených spotřebitelských úvěrů a zároveň podíl jimi sjednaných spotřebitelských úvěrů, které jsou v prodlení s alespoň jednou splátkou či s jinými problémy, nepřekročí 3 % jimi sjednaného počtu úvěrů, dostanou pro následující rok navíc týden zvláštního volna vykázaného jako dovolená.g) Každý pracovník, který sjedná úvěr na koupi automobilu od autosalónu Pink & bratři s.r.o., dostane zvláštní provizi ve výši 1,25 % z výše řádně zaplacené splátky úvěru za prvních 15 měsíců jeho splácení, a to přímo od prodejce automobilu.h) Vánoční odměny v předpokládané výši \"třináctého platu\" budou každému pracovníkovi kráceny o 50 Kč za každou klientovi zaslanou upomínku k jím sjednanému spotřebitelskému úvěru, o 100 Kč pak za prodlení klienta s každou splátkou jím sjednaného spotřebitelského úvěru za každý měsíc prodlení.","question":"Které z výše uvedených ustanovení a), d), e) a f) neporušuje závazná pravidla jednání stanovená v zákoně o spotřebitelském úvěru?","options":["ustanovení f), protože se jedná o benefit, který sice vede k maximalizaci počtu sjednaných úvěrů, avšak jen řádně splácených, tedy těch, které byly s vysokou pravděpodobností sjednány bez ohrožení povinnosti poskytovat úvěry v souladu se zájmy spotřebitelů","ustanovení d) protože je samozřejmé, že za práci přísluší odměna. Tím spíše přísluší odměna za poskytování rady, za niž i podle občanského zákoníku firma a pracovník nesou odpovědnost - za špatnou radu mohou být žalováni k náhradě škody takovou radou způsobené. Je samozřejmé, že na takové případy je nutně třeba mít ve firmě finanční rezervy a ty je třeba z nějakých příjmů vytvořit","ustanovení e), protože nabádá pracovníky ke dvěma variantám postupu, z nichž obě mohou být v rozporu se zájmy spotřebitelů: buď vede k vyšším než nutným úvěrům (aby přesáhly hranici 750 000 Kč, poskytují jim slevenky na materiál), nebo u podlimitních úvěrů nabádá k nabízení úvěrů od poskytovatelů, od nichž má SolidCredit vyšší provizi","ustanovení a), protože každá firma stojí na spolehlivých pracovnících a ti se nejlépe seženou přes osobní známé, překážkou není ani poplatek za školení, protože smlouva bude se zájemci podepsána až po úspěšném absolvování vstupního školení, do té doby navíc nejde o pracovníky firmy ani o osoby s ní jakkoliv spojené, ty se pouze při     this.unsubs = [];
    clearTimeout(this.pollTimer);
    if (local) { S.progress = clone(local.progress || emptyProgress()); S.run = clone(local.run || emptyRun()); S.sel = S.run.sel || []; }
    this.mode = 'local';
    checkBank();
    this.persistLocal();
    if (S.run.active && !S.run.finished) S.screen = 'quiz';
    renderChrome(); render();
  },

  onSnap(key, snap) {
    if (this.mode === 'local') return;
    const d = snap.exists ? snap.data() : null;
    const first = !this.seen[key];
    this.seen[key] = true;
    const cur = key === 'progress' ? S.progress : S.run;
    if (first && this.dirty[key] && (cur.updatedAt || 0) > (d?.updatedAt || 0)) {
      // answered while still connecting: push the newer local state instead of dropping it
      this.dirty[key] = false;
      if (this.mode === 'shared') this.flush(key); else this.useLocalFromCurrent();
      return;
    }
    if (!d) { if (first) { S[key] = key === 'progress' ? emptyProgress() : emptyRun(); } else return; }
    else if (first || (d.updatedAt || 0) >= (cur.updatedAt || 0)) {
      if (this.writing[key] && !first) return;   // our own newer write is on its way
      S[key] = clone(d);
    } else return;
    if (key === 'progress' && !checkBank()) return;
    lsSet('cztest:mirror', { progress: S.progress, run: S.run });
    onRemoteChange(key, first);
  },

  save(key) {
    const obj = key === 'progress' ? S.progress : S.run;
    obj.updatedAt = Date.now();
    if (this.mode === 'readonly') { this.useLocalFromCurrent(); return; }
    if (this.mode === 'connecting') { this.dirty[key] = true; lsSet('cztest:mirror', { progress: S.progress, run: S.run }); return; }
    if (this.mode === 'local') { this.persistLocal(); return; }
    lsSet('cztest:mirror', { progress: S.progress, run: S.run });
    this.flush(key);
  },

  async flush(key) {
    if (this.writing[key]) { this.again[key] = true; return; }
    this.writing[key] = true;
    try {
      do {
        this.again[key] = false;
        await this.write(key);
      } while (this.again[key]);
    } catch (e) {
      if (this.backend === 'remote') { this.dirty[key] = true; toast('Нет связи с общим прогрессом. Повторю сохранение автоматически.'); }
      else if (e?.code === 'invalid_argument' || e?.code === 'not_granted' || e?.code === 'revoked' || e?.code === 'capability_disabled') { this.reason = this.reason || 'nowrite'; this.useLocalFromCurrent(); }
      else toast('Не удалось сохранить. Попробуйте ещё раз.');
    } finally { this.writing[key] = false; }
    if (this.newer[key]) {
      // the sheet held a newer copy than ours: take it, as if it had arrived by polling
      const d = this.newer[key]; this.newer[key] = null;
      this.onSnap(key, { exists: true, data: () => d });
    }
  },

  async write(key) {
    const data = clone(key === 'progress' ? S.progress : S.run);
    if (this.backend === 'remote') {
      const res = await remote.post(key, data);
      if (res && res.stale && res[key]) this.newer[key] = res[key];
      return;
    }
    try { await this.refs[key].set(data); }
    catch (e) {
      if (e?.code !== 'unavailable') throw e;
      await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      await this.refs[key].set(data);
    }
  },

  useLocalFromCurrent() {
    this.unsubs.forEach(u => { try { u(); } catch { /* already closed */ } });
    this.unsubs = [];
    clearTimeout(this.pollTimer);
    this.mode = 'local';
    this.persistLocal();
    render();
  },

  persistLocal() { lsSet('cztest:local', { progress: S.progress, run: S.run }); },
};

/* Owner/editor views republish the page with the current state embedded when they go to the
   background, so the link opens at the latest point even where the database is unreachable. */
const snapshot = {
  artifact: null, busy: false,
  async init(user) {
    try {
      if (!user || !(await user.canEdit())) return;
      this.artifact = await window.claude.use('artifact');
    } catch { this.artifact = null; }
    if (!this.artifact || !PAGE || !SKELETON_HEAD) return;
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.publish(); });
    window.addEventListener('pagehide', () => this.publish());
  },
  async publish() {
    if (!this.artifact || this.busy || store.mode !== 'shared') return;
    const state = { progress: S.progress, run: S.run };
    if (stampOf(state) <= stampOf(EMBEDDED)) return;
    this.busy = true;
    try {
      const content = renderPage(jsonForScript(state));
      await this.artifact.publish(SKELETON_HEAD + content + '\n</body></html>');
    } catch { /* conflict, rate limit or no permission: the shared database still holds the state */ }
    finally { this.busy = false; }
  },
};

/* Progress belongs to one question bank. When the bank changes (a new questions.json), the first
   page built with it starts the progress over; a page still running an older bank leaves the shared
   progress alone and asks to be reloaded. Returns false when this page is the outdated one. */
function checkBank() {
  const b = S.progress.bank;
  if (b && b.id === BUILD.bank) return true;
  if (b && (BUILD.bankCompat || []).includes(b.id)) {
    // same questions under an older fingerprint (e.g. only regrouped): keep the progress, adopt the new id
    S.progress.bank = { id: BUILD.bank, builtAt: BUILD.builtAt };
    store.save('progress');
    return true;
  }
  const hasData = b || Object.keys(S.progress.q || {}).length || (S.progress.history || []).length || S.run.active;
  if (!hasData) { S.progress.bank = { id: BUILD.bank, builtAt: BUILD.builtAt }; return true; }
  if (b && (b.builtAt || 0) > BUILD.builtAt) {
    store.reason = 'stale';
    store.useLocalFromCurrent();
    return false;
  }
  S.progress = emptyProgress(); S.run = emptyRun(); S.sel = []; S.screen = 'setup'; S.lastRunSig = runSig();
  store.seen.run = true;   // an older run arriving later must not count as the first snapshot
  store.save('progress'); store.save('run');
  setTimeout(() => { render(); toast('Вопросы обновлены — прогресс начат заново.'); }, 0);
  return true;
}

function onRemoteChange(key, first) {
  if (key === 'run') {
    if (first && S.run.active && !S.run.finished) S.screen = 'quiz';
    const sig = runSig();
    if (sig !== S.lastRunSig || first) { S.lastRunSig = sig; S.sel = S.run.sel || []; if (S.screen !== 'stats') render(); }
  } else if (S.screen !== 'quiz' || first) render();
  renderChrome();
}
const runSig = () => { const r = S.run; return r.active ? `${r.id}:${r.pos}:${r.order.length}:${(r.log || []).filter(Boolean).length}:${r.finished}` : 'none'; };

/* ---------- per-question statistics ---------- */
const st = id => S.progress.q[id];
function statusOf(id) {
  const s = st(id);
  if (!s || !s.s) return 'new';
  if (s.k >= MASTERED_STREAK) return 'done';
  if (s.w > 0) return 'err';
  return 'learn';
}
function record(id, ok) {
  const s = S.progress.q[id] || (S.progress.q[id] = { s: 0, r: 0, w: 0, k: 0, t: 0 });
  s.s++; s.t = Date.now();
  if (ok) { s.r++; s.k++; } else { s.w++; s.k = 0; }
}
const difficulty = s => (1 + 2 * s.w) / (1 + s.r) * (s.k >= MASTERED_STREAK ? 0.2 : 1);

/* ---------- picking questions for a run ---------- */
function filtered(cfg) {
  if (cfg.mode === 'cases') {
    // only case topics count here; none of them picked means all cases
    const cats = cfg.cats.filter(c => CASE_CATS.includes(c));
    return QS.filter(q => q.case && (!cats.length || cats.includes(q.category)));
  }
  return QS.filter(q => (!cfg.cats.length || cfg.cats.includes(q.category)) && (!cfg.kinds.length || cfg.kinds.includes(q.kind)));
}
function poolFor(mode, list) {
  if (mode === 'errors') return list.filter(q => (st(q.id)?.w || 0) > 0);
  if (mode === 'review') return list.filter(q => (st(q.id)?.r || 0) > 0);
  return list;
}
const casesIn = list => [...new Set(list.filter(q => q.case).map(q => q.case))];
// how many units the slider counts: case studies in the case mode, questions otherwise
const availFor = (mode, list) => mode === 'cases' ? casesIn(list).length : poolFor(mode, list).length;
function pick(mode, list, n) {
  if (mode === 'cases') {
    // least practised cases first; a case keeps its questions together and in order
    const seen = id => CASES[id].reduce((a, qid) => a + (st(qid)?.s || 0), 0) / CASES[id].length;
    return shuffle(casesIn(list)).sort((a, b) => seen(a) - seen(b)).slice(0, n).flatMap(id => CASES[id]);
  }
  const pool = poolFor(mode, list);
  let ranked;
  if (mode === 'errors') {
    // weighted sampling without replacement: the harder a question is for you, the likelier it comes up
    ranked = pool.map(q => [q.id, Math.pow(Math.random(), 1 / difficulty(st(q.id)))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  } else if (mode === 'review') {
    ranked = shuffle(pool.slice()).sort((a, b) => (st(a.id).t || 0) - (st(b.id).t || 0)).map(q => q.id);
  } else {
    ranked = shuffle(pool.slice()).sort((a, b) => (st(a.id)?.s || 0) - (st(b.id)?.s || 0)).map(q => q.id);
  }
  return shuffle(ranked.slice(0, n));
}
function countBounds(avail, mode) {
  const max = Math.min(COUNT_MAX, avail);
  return { min: mode === 'cases' ? Math.min(1, max) : Math.min(COUNT_MIN, max), max };
}
const cfgCount = cfg => cfg.mode === 'cases' ? cfg.caseCount : cfg.count;

/* ---------- run lifecycle ---------- */
function startRun() {
  const cfg = prefs.cfg;
  const list = filtered(cfg);
  const avail = availFor(cfg.mode, list);
  if (!avail) return;
  const { min, max } = countBounds(avail, cfg.mode);
  const ids = pick(cfg.mode, list, clamp(cfgCount(cfg), min, max));
  S.run = {
    active: true, id: Date.now().toString(36), startedAt: Date.now(), mode: cfg.mode, hard: cfg.hard,
    cats: cfg.cats.slice(), kinds: cfg.kinds.slice(), main: ids.length, order: ids, pos: 0, log: [],
    firstOk: 0, firstBad: 0, finished: false, updatedAt: 0,
  };
  S.sel = []; S.confirm = null; S.screen = 'quiz'; S.lastRunSig = runSig();
  store.save('run');
  render(); window.scrollTo(0, 0);
}
function currentQ() {
  const r = S.run;
  while (r.pos < r.order.length && !QMAP[r.order[r.pos]]) r.pos++;   // skip questions removed from the bank
  return r.pos < r.order.length ? QMAP[r.order[r.pos]] : null;
}
function submit() {
  const r = S.run, q = currentQ();
  if (!q || r.log[r.pos] || !S.sel.length) return;
  const picked = S.sel.slice().sort((a, b) => a - b);
  const ok = sameSet(picked, q.correct);
  r.log[r.pos] = { p: picked, ok };
  r.sel = [];
  clearTimeout(selTimer);
  if (r.pos < r.main) ok ? r.firstOk++ : r.firstBad++;
  if (!ok && !r.order.slice(r.pos + 1).includes(q.id)) r.order.push(q.id);   // ask again until answered correctly
  record(q.id, ok);
  playSound(ok);
  S.lastRunSig = runSig();
  store.save('run'); store.save('progress');
  render();
  if (!ok) $('.opts')?.classList.add('shake');
  $('.answer-bar')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() {
  const r = S.run;
  if (!r.log[r.pos]) return;
  r.pos++;
  S.sel = []; r.sel = [];
  if (!currentQ()) finishRun();
  S.lastRunSig = runSig();
  store.save('run');
  render(); window.scrollTo(0, 0);
}
function finishRun() {
  const r = S.run;
  r.finished = true;
  r.mainDone = r.log.slice(0, r.main).filter(Boolean).length;
  const h = S.progress.history;
  h.push({ t: Date.now(), mode: r.mode, n: r.mainDone, ok: r.firstOk, extra: r.order.length - r.main, hard: !!r.hard });
  if (h.length > HISTORY_LIMIT) h.splice(0, h.length - HISTORY_LIMIT);
  store.save('progress');
}
function discardRun() {
  S.run = emptyRun(); S.sel = []; S.confirm = null; S.lastRunSig = runSig();
  store.save('run');
}

/* ---------- sound ---------- */
let actx = null;
function playSound(ok) {
  if (!prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const notes = ok ? [[659.25, 0, .22], [987.77, .09, .3]] : [[196, 0, .22], [146.83, .13, .32]];
    for (const [f, d, len] of notes) {
      const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
      o.type = ok ? 'sine' : 'sawtooth';
      o.frequency.setValueAtTime(f, t0 + d);
      lp.type = 'lowpass'; lp.frequency.value = ok ? 4000 : 700;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(ok ? 0.22 : 0.18, t0 + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(lp).connect(g).connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + len + 0.05);
    }
  } catch { /* audio unavailable */ }
}

/* ---------- views ---------- */
function localBanner() {
  if (S.bannerClosed || (store.mode !== 'local' && store.mode !== 'readonly')) return '';
  const texts = {
    nowrite: `<strong>У вашего аккаунта доступ только на просмотр.</strong>

    remote: `<strong>Нет связи с общим прогрессом.</strong>

    noconfig: `<strong>Общий прогресс не подключён.</strong>
